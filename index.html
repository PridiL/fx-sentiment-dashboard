<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Sentiment Dashboard</title>
<style>
  /* ── tokens ─────────────────────────────────────────────────────────────
     Diverging pair blue<->red with a neutral gray midpoint: long vs short is
     polarity, so it gets the diverging job, not categorical hues. Both poles
     validated against both surfaces (CVD dE 21.6 light / 19.2 dark).        */
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7;
    --long:#2a78d6; --short:#e34948; --mid:#f0efec;
    --good:#006300; --bad:#d03b3b; --warn:#fab219;
    --shadow:0 1px 2px rgba(11,11,11,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835;
      --long:#3987e5; --short:#e66767; --mid:#383835;
      --good:#0ca30c; --bad:#e66767; --warn:#fab219;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --long:#3987e5; --short:#e66767; --mid:#383835;
    --good:#0ca30c; --bad:#e66767; --warn:#fab219;
    --shadow:none;
  }

  *{box-sizing:border-box}
  body{
    margin:0;padding:20px 18px 48px;background:var(--plane);color:var(--ink);
    font:400 13px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1180px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums}

  /* ── header ── */
  header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.2px}
  .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .sub b{color:var(--ink-2);font-weight:500}
  .themer{
    margin-left:auto;font:inherit;font-size:11.5px;padding:6px 12px;cursor:pointer;
    border:1px solid var(--grid);border-radius:6px;background:var(--surface);color:var(--ink-2);
  }

  /* ── cards ── */
  .card{
    background:var(--surface);border:1px solid var(--grid);border-radius:9px;
    padding:15px 16px;box-shadow:var(--shadow);
  }
  h2{
    font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;
  }
  h2 span{text-transform:none;letter-spacing:0;font-weight:400}

  /* ── alerts ── */
  .alert{
    display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding:10px 13px;
    border-radius:8px;border:1px solid var(--warn);background:var(--surface);
    font-size:12px;line-height:1.55;color:var(--ink-2);
  }
  .alert b{color:var(--ink);font-weight:600}
  .alert .ico{
    flex:none;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#0b0b0b;
    font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .alert.crit{border-color:var(--bad)}
  .alert.crit .ico{background:var(--bad);color:#fff}

  /* ── KPI strip ── */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi .k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:23px;font-weight:600;margin:5px 0 2px;letter-spacing:-.5px}
  .kpi .d{font-size:11.5px;color:var(--ink-2)}
  .kpi .d em{font-style:normal;font-weight:500}

  /* ── two-column body ── */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media (max-width:900px){
    .cols,.kpis{grid-template-columns:1fr}
  }

  /* ── bars ─────────────────────────────────────────────────────────────
     100% stacked: long share + short share of open interest. 2px surface
     gap between the two fills, 4px rounded outer ends, <=24px thick.     */
  .legend{display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--muted);margin-bottom:10px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .legend .sp{margin-left:auto}

  .brow{display:grid;grid-template-columns:78px 1fr 74px;align-items:center;gap:9px;margin-bottom:7px;cursor:pointer}
  .brow:hover .track{filter:brightness(1.06)}
  .brow.on .sym{color:var(--ink);font-weight:600}
  .sym{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{position:relative;display:flex;height:20px;gap:2px}
  .track .l{background:var(--long);border-radius:4px 0 0 4px}
  .track .s{background:var(--short);border-radius:0 4px 4px 0;flex:1}
  .track .l,.track .s{display:flex;align-items:center;min-width:0}
  .track .l span,.track .s span{
    font-size:10px;font-weight:600;color:#fff;padding:0 6px;white-space:nowrap;
  }
  .track .s span{margin-left:auto}
  .mid{position:absolute;left:calc(50% - .5px);top:-2px;bottom:-2px;width:1px;background:var(--baseline);z-index:2}
  .bend{font-size:11px;text-align:right;color:var(--ink-2)}

  /* ── detail ── */
  .drow{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;gap:9px;margin-bottom:9px}
  .drow .who b{display:block;font-size:12px;font-weight:500}
  .drow .who i{display:block;font-style:normal;font-size:9.5px;color:var(--muted)}
  .drow .track{height:24px}
  .dsep{border-top:1px dashed var(--baseline);margin:10px 0 9px}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
  .tile{border:1px solid var(--grid);border-radius:7px;padding:9px 11px;background:var(--plane)}
  .tile.l{border-left:3px solid var(--long)}
  .tile.r{border-left:3px solid var(--baseline)}
  .tile.s{border-left:3px solid var(--short)}
  .tile .k{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-size:17px;font-weight:600;margin:2px 0 1px}
  .tile .d{font-size:10.5px}
  .up{color:var(--good)} .down{color:var(--bad)}
  .verdict{
    margin-top:11px;font-size:11.5px;line-height:1.6;color:var(--ink-2);
    padding:9px 11px;border-radius:6px;background:var(--plane);border:1px solid var(--grid);
  }
  .verdict b{color:var(--ink);font-weight:600}

  /* ── controls ── */
  .ctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .ctl input{
    font:inherit;font-size:12px;padding:5px 10px;border-radius:6px;
    border:1px solid var(--grid);background:var(--plane);color:var(--ink);width:120px;
  }
  .chip{
    font:inherit;font-size:11px;padding:4px 11px;border-radius:20px;cursor:pointer;
    border:1px solid var(--grid);background:transparent;color:var(--ink-2);
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

  /* ── table ── */
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:11.5px}
  th{
    text-align:left;font-weight:600;color:var(--muted);font-size:9.5px;letter-spacing:.5px;
    text-transform:uppercase;padding:0 9px 7px 0;border-bottom:1px solid var(--baseline);
    white-space:nowrap;cursor:pointer;
  }
  th.n{text-align:right}
  th:hover{color:var(--ink-2)}
  td{padding:6px 9px 6px 0;border-bottom:1px solid var(--grid);white-space:nowrap}
  td.n{text-align:right}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--plane)}
  .tag{
    display:inline-block;min-width:46px;text-align:center;padding:1px 7px;border-radius:3px;
    color:#fff;font-size:10px;font-weight:600;
  }

  /* ── tooltip ── */
  #tip{
    position:fixed;pointer-events:none;z-index:99;opacity:0;transition:opacity .1s;
    background:var(--ink);color:var(--surface);font-size:11px;line-height:1.5;
    padding:7px 10px;border-radius:6px;max-width:250px;box-shadow:0 4px 14px rgba(0,0,0,.22);
  }
  #tip b{font-weight:600}
  #tip .r{display:flex;justify-content:space-between;gap:14px}

  .note{margin-top:16px;font-size:11px;line-height:1.65;color:var(--muted)}
  .note b{color:var(--ink-2);font-weight:500}
  .note code{font-family:ui-monospace,Menlo,monospace;font-size:10px;
             background:var(--plane);border:1px solid var(--grid);padding:1px 4px;border-radius:3px}
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <h1>FX Retail Sentiment</h1>
      <div class="sub" id="sub">—</div>
    </div>
    <button class="themer" id="themer">Toggle theme</button>
  </header>

  <div id="alerts"></div>
  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <section class="card">
      <h2>Broker split <span id="detailSym"></span></h2>
      <div id="detail"></div>
    </section>

    <section class="card">
      <h2>Positioning by pair <span>— click to inspect</span></h2>
      <div class="ctl">
        <input id="q" placeholder="Filter…" autocomplete="off">
        <button class="chip" data-sort="skew" aria-pressed="true">Most crowded</button>
        <button class="chip" data-sort="long">Most long</button>
        <button class="chip" data-sort="disagree">Disagreement</button>
        <button class="chip" data-sort="name">A–Z</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--long)"></i>Long</span>
        <span><i style="background:var(--short)"></i>Short</span>
        <span class="sp">share of open interest · mean of sources</span>
      </div>
      <div id="bars"></div>
    </section>
  </div>

  <section class="card">
    <h2>All data <span>— every comparable pair, sortable</span></h2>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-k="s">Pair</th>
          <th class="n" data-k="mfb">MyFxBook</th>
          <th class="n" data-k="duk">Dukascopy</th>
          <th class="n" data-k="mean">Mean long</th>
          <th class="n" data-k="spread">Disagree</th>
          <th data-k="skew">Crowd</th>
          <th class="n" data-k="al">Avg long</th>
          <th class="n" data-k="as">Avg short</th>
          <th class="n" data-k="rate">Rate</th>
          <th class="n" data-k="pnl">Crowd P&amp;L</th>
          <th class="n" data-k="pos">Positions</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="note" id="note"></div>
  </section>

</div>
<div id="tip"></div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const MIN_POSITIONS = 250;          // books thinner than this print 100%/0% noise

const pct  = v => v == null ? "—" : v.toFixed(2) + "%";
const px   = (v,d) => v == null ? "—" : v.toFixed(Math.max(2,(d||5)-1));
const sgn  = (v,u,dp=0) => v == null ? "—" : (v>=0?"+":"") + v.toFixed(dp) + u;
const esc  = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── model ─────────────────────────────────────────────────────────────── */
/* Normal mode: pairs covered by BOTH sources, minus thin books. If a source is
   down, fall back to the survivor's G10 FX + metals instead of an empty page --
   that blank page is what hid a dead MyFxBook feed for three days (Sep 8-10). */
const SOURCES  = Object.keys(DATA.source_meta);
const ERRORS   = DATA.errors || {};
const MULTI_OK = Object.values(DATA.symbols).some(v => v.coverage > 1);
const MAJORS   = new Set(["USD","EUR","JPY","GBP","AUD","NZD","CAD","CHF","XAU","XAG"]);
const isMajor  = s => s.length === 6 && MAJORS.has(s.slice(0,3)) && MAJORS.has(s.slice(3));

const ROWS = Object.entries(DATA.symbols)
  .filter(([s,v]) => MULTI_OK
    ? v.coverage > 1 && (v.positions||0) >= MIN_POSITIONS
    : isMajor(s) && (!(v.positions > 0) || v.positions >= MIN_POSITIONS))
  .map(([s,v]) => {
    const by = Object.fromEntries(v.sources.map(e => [e.source, e.long_pct]));
    const mean = v.average_long_pct;
    const p = v.prices || null;
    return {
      s, v, p,
      mfb: by.MyFxBook ?? null, duk: by.Dukascopy ?? null,
      mean, spread: v.spread_pct, pos: v.positions || 0,
      skew: Math.abs(mean - 50),                       // how one-sided
      long: mean > 50,
      pnl: p ? (mean > 50 ? p.long_move_pct : p.short_move_pct) : null,
      trapped: p && p.long_move_pct != null && p.short_move_pct != null
        ? (p.long_move_pct < 0 && p.short_move_pct < 0) : false,
    };
  });

let sortMode = "skew", query = "", selected =
  ROWS.some(r => r.s === "EURUSD") ? "EURUSD" : (ROWS[0]||{}).s;
let tableKey = "skew", tableDir = -1;

const sorters = {
  skew:      (a,b) => b.skew - a.skew,
  long:      (a,b) => b.mean - a.mean,
  disagree:  (a,b) => b.spread - a.spread,
  name:      (a,b) => a.s.localeCompare(b.s),
};

/* ── header ── */
document.getElementById("sub").innerHTML =
  `Collected <b>${esc(new Date(DATA.captured_utc).toUTCString().replace("GMT","UTC"))}</b>`
  + ` · ${SOURCES.length} live source${SOURCES.length === 1 ? "" : "s"}`
  + (MULTI_OK ? ` · ${ROWS.length} pairs covered by both`
             : ` · ${ROWS.length} pairs · single source`);

/* theme toggle: an explicit stamp must beat the OS setting in both directions */
document.getElementById("themer").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme");
  const dark = now ? now === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});

/* ── tooltip ── */
const tip = document.getElementById("tip");
function showTip(html, ev){
  tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8)  x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

function tipFor(r){
  const p = r.p;
  return `<b>${esc(r.s)}</b>`
    + `<div class="r"><span>Long</span><span>${pct(r.mean)}</span></div>`
    + `<div class="r"><span>Short</span><span>${pct(100-r.mean)}</span></div>`
    + `<div class="r"><span>MyFxBook / Dukascopy</span><span>${pct(r.mfb)} / ${pct(r.duk)}</span></div>`
    + `<div class="r"><span>Disagreement</span><span>${r.v.coverage > 1 ? r.spread.toFixed(2) + "pp" : "—"}</span></div>`
    + (p ? `<div class="r"><span>Avg long / short</span><span>${px(p.avg_long_price,p.decimals)} / ${px(p.avg_short_price,p.decimals)}</span></div>` : "")
    + `<div class="r"><span>Open positions</span><span>${r.pos > 0 ? r.pos.toLocaleString() : "—"}</span></div>`;
}

/* ── a 100% stacked long/short bar ── */
function bar(longPct, showLabels, height){
  const short = 100 - longPct;
  const lab = (v, side) =>
    showLabels && v > 17 ? `<span>${v.toFixed(showLabels === 2 ? 2 : 0)}%</span>` : "";
  return `<div class="track"${height ? ` style="height:${height}px"` : ""}>`
       +   `<div class="l" style="width:calc(${longPct}% - 1px)">${lab(longPct,showLabels)}</div>`
       +   `<div class="s">${lab(short,showLabels)}</div>`
       +   `<div class="mid"></div>`
       + `</div>`;
}

/* ── KPI strip ── */
function renderKpis(){
  if (!ROWS.length) return;
  const byLong  = [...ROWS].sort((a,b) => b.mean - a.mean);
  const mostLong = byLong[0], mostShort = byLong[byLong.length-1];
  const widest  = [...ROWS].sort((a,b) => b.spread - a.spread)[0];
  const trapped = ROWS.filter(r => r.trapped);

  const tile = (k,v,d) => `<div class="card kpi"><div class="k">${k}</div>
      <div class="v num">${v}</div><div class="d">${d}</div></div>`;

  document.getElementById("kpis").innerHTML =
      tile("Most crowded long", `${mostLong.mean.toFixed(1)}%`,
           `<em>${esc(mostLong.s)}</em> — crowd ${mostLong.pnl!=null?sgn(mostLong.pnl,"%",2):"—"}`)
    + tile("Most crowded short", `${(100-mostShort.mean).toFixed(1)}%`,
           `<em>${esc(mostShort.s)}</em> — crowd ${mostShort.pnl!=null?sgn(mostShort.pnl,"%",2):"—"}`)
    + (MULTI_OK
        ? tile("Widest disagreement", `${widest.spread.toFixed(1)}pp`,
               `<em>${esc(widest.s)}</em> — ${pct(widest.mfb)} vs ${pct(widest.duk)}`)
        : tile("Widest disagreement", "—", "needs both sources"))
    + (ROWS.some(r => r.p && r.p.rate != null)
        ? tile("Both sides underwater", `${trapped.length}`,
               `of ${ROWS.length} pairs — price between both averages`)
        : tile("Both sides underwater", "—", "needs a live rate"));
}

/* ── bar list ── */
function renderBars(){
  const rows = ROWS
    .filter(r => !query || r.s.includes(query))
    .sort(sorters[sortMode]);

  document.getElementById("bars").innerHTML = rows.map(r => `
    <div class="brow${r.s === selected ? " on" : ""}" data-s="${esc(r.s)}">
      <div class="sym">${esc(r.s)}</div>
      ${bar(r.mean, 1)}
      <div class="bend num">${r.long ? pct(r.mean) : pct(100-r.mean)}
        <span style="color:var(--muted)">${r.long ? "L" : "S"}</span></div>
    </div>`).join("") || `<div class="sub">No pair matches “${esc(query)}”.</div>`;

  document.querySelectorAll(".brow").forEach(el => {
    const r = ROWS.find(x => x.s === el.dataset.s);
    el.addEventListener("mousemove", ev => showTip(tipFor(r), ev));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", () => { selected = r.s; renderDetail(); renderBars(); });
  });
}

/* ── selected-pair detail ── */
function renderDetail(){
  const r = ROWS.find(x => x.s === selected);
  document.getElementById("detailSym").textContent = r ? "— " + r.s : "";
  if (!r){ document.getElementById("detail").innerHTML = ""; return; }

  const meth = s => (DATA.source_meta[s]||{}).method || "";
  const line = (name, sub, val) => `
    <div class="drow">
      <div class="who"><b>${esc(name)}</b><i>${esc(sub)}</i></div>
      ${bar(val, 2, 24)}
      <div class="bend num">${val > 50 ? "net long" : "net short"}</div>
    </div>`;

  let html = r.v.sources
    .slice().sort((a,b) => b.long_pct - a.long_pct)
    .map(e => line(e.source, meth(e.source), e.long_pct)).join("")
    + (r.v.coverage > 1
        ? `<div class="dsep"></div>`
          + line("Average", `mean of ${r.v.coverage} · ±${r.spread.toFixed(2)}pp`, r.mean)
        : "");

  const p = r.p;
  if (p){
    const d = p.decimals;
    const side = (pips, mv) =>
      `<div class="d ${mv==null?"":mv>=0?"up":"down"} num">${pips==null?"":sgn(pips," pips")+" · "}${sgn(mv,"%",2)}</div>`;
    html += `
      <div class="tiles">
        <div class="tile l"><div class="k">Avg long entry</div>
          <div class="v num">${px(p.avg_long_price,d)}</div>${side(p.long_pips,p.long_move_pct)}</div>
        <div class="tile r"><div class="k">Current rate</div>
          <div class="v num">${px(p.rate,d)}</div><div class="d" style="color:var(--muted)">${esc(p.rate_source || p.source)}</div></div>
        <div class="tile s"><div class="k">Avg short entry</div>
          <div class="v num">${px(p.avg_short_price,d)}</div>${side(p.short_pips,p.short_move_pct)}</div>
      </div>
      <div class="verdict">${verdict(r, p)}</div>`;
  } else {
    html += `<div class="verdict">No average entry prices for ${esc(r.s)} — only
             MyFxBook publishes them, and ${ERRORS.MyFxBook
               ? "MyFxBook is unavailable on this run"
               : "it does not cover this symbol"}.</div>`;
  }
  document.getElementById("detail").innerHTML = html;
}

function verdict(r, p){
  if (p.long_move_pct == null && p.short_move_pct == null)
    return `<b>No live rate this run.</b> Average entries are shown, but how far each
      side is on- or offside needs a current price, which this source does not send.`;
  const lu = p.long_move_pct >= 0, su = p.short_move_pct >= 0;
  const crowd = r.long ? "long" : "short";
  const crowdOk = r.long ? lu : su;
  if (!lu && !su){
    const worse = Math.abs(p.long_move_pct) > Math.abs(p.short_move_pct) ? "longs" : "shorts";
    return `<b>Both sides underwater.</b> Price sits between the two average entries,
      so longs and shorts are each holding a loss — ${worse} the heavier. The
      ${crowd} side is the crowd (${pct(r.long ? r.mean : 100-r.mean)} of the book),
      which is the side with more to unwind.`;
  }
  if (lu && su)
    return `<b>Both sides in profit.</b> Unusual — the averages straddle a range
      price has just left, so neither side is trapped.`;
  return `<b>The crowd is ${crowdOk ? "onside" : "offside"}.</b>
    ${pct(r.long ? r.mean : 100-r.mean)} of the book is ${crowd}, and that side is
    ${sgn(r.long ? p.long_move_pct : p.short_move_pct, "%", 2)} from its average entry.
    ${crowdOk ? "No squeeze pressure building." :
      "A losing majority is what fuels a squeeze if price keeps running against it."}`;
}

/* ── table ── */
const cellPnl = r => r.pnl == null ? "—"
  : `<span class="${r.pnl>=0?"up":"down"}">${sgn(r.pnl,"%",2)}</span>`;

function renderTable(){
  const rows = ROWS
    .filter(r => !query || r.s.includes(query))
    .sort((a,b) => {
      const A = a[tableKey], B = b[tableKey];
      if (typeof A === "string") return tableDir * A.localeCompare(B);
      return tableDir * ((A ?? -Infinity) - (B ?? -Infinity));
    });

  document.getElementById("tbody").innerHTML = rows.map(r => {
    const share = r.long ? r.mean : 100 - r.mean;
    return `<tr data-s="${esc(r.s)}">
      <td><b>${esc(r.s)}</b></td>
      <td class="n num">${pct(r.mfb)}</td>
      <td class="n num">${pct(r.duk)}</td>
      <td class="n num">${pct(r.mean)}</td>
      <td class="n num" ${r.spread>10?'style="color:var(--warn)"':""}>${r.v.coverage > 1 ? r.spread.toFixed(2) + "pp" : "—"}</td>
      <td><span class="tag" style="background:${r.long?"var(--long)":"var(--short)"}">${r.long?"LONG":"SHORT"} ${share.toFixed(0)}%</span></td>
      <td class="n num">${r.p?px(r.p.avg_long_price,r.p.decimals):"—"}</td>
      <td class="n num">${r.p?px(r.p.avg_short_price,r.p.decimals):"—"}</td>
      <td class="n num">${r.p?px(r.p.rate,r.p.decimals):"—"}</td>
      <td class="n num">${cellPnl(r)}</td>
      <td class="n num">${r.pos > 0 ? r.pos.toLocaleString() : "—"}</td>
    </tr>`;
  }).join("");

  document.querySelectorAll("#tbody tr").forEach(tr =>
    tr.addEventListener("click", () => {
      selected = tr.dataset.s; renderDetail(); renderBars();
      document.querySelector(".cols").scrollIntoView({behavior:"smooth", block:"start"});
    }));
}

document.querySelectorAll("th[data-k]").forEach(th =>
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    tableDir = tableKey === k ? -tableDir : (k === "s" ? 1 : -1);
    tableKey = k; renderTable();
  }));

/* ── controls ── */
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toUpperCase();
  renderBars(); renderTable();
});
document.querySelectorAll(".chip[data-sort]").forEach(b =>
  b.addEventListener("click", () => {
    sortMode = b.dataset.sort;
    document.querySelectorAll(".chip[data-sort]")
      .forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderBars();
  }));

document.getElementById("note").innerHTML = `
  <b>Method.</b> Every figure is fetched live and computed here — nothing hard-coded.
  <code>long %</code> is the share of open interest positioned long; short is its
  complement. <b>MyFxBook</b> comes from its official API, volume-weighted from raw lot
  totals (<code>long_lots / (long_lots + short_lots)</code>) rather than the rounded
  percentage it prints. <b>Dukascopy</b> is the SWFX
  Sentiment Index (<code>liquidity=consumers</code>, ~30 min refresh). Average entry
  prices come from MyFxBook only — Dukascopy publishes ratios alone. The current rate
  behind each side's distance is a spot mid from Swissquote's public quote feed (FX and
  metals) or Yahoo Finance (crypto). Pips are shown for FX only, where the convention is
  standard; gold and crypto show the percentage distance.
  Pairs with fewer than ${MIN_POSITIONS} open positions are excluded: thin books print
  100%/0% and would dominate every ranking.
  <br><br>
  <b>Read the disagreement column.</b> Two honest brokers can differ by 15–40pp on the
  same pair at the same minute, because their client bases differ. A wide spread means
  "retail sentiment" is not one number, and any single-broker reading deserves suspicion.
  <br><br>
  <b>Refresh.</b> This page rebuilds automatically every day at
  <b>08:00 Asia/Bangkok</b> (01:00 UTC) and republishes itself. The timestamp at the
  top is the moment the data was actually fetched, not the moment you loaded the page.`;

/* ── alerts: say out loud when data is old or a source is missing ── */
function renderAlerts(){
  const out = [];
  const when = new Date(DATA.captured_utc).toUTCString().replace("GMT","UTC");
  const ageH = (Date.now() - Date.parse(DATA.captured_utc)) / 36e5;
  if (ageH > 36)
    out.push(["crit", `<b>Stale: this data is ${ageH < 72 ? Math.round(ageH) + " hours"
      : Math.floor(ageH/24) + " days"} old.</b> The daily 08:00 refresh has not published
      since ${esc(when)}. Everything below is from that run.`]);
  for (const [src, msg] of Object.entries(ERRORS))
    out.push(["", `<b>${esc(src)} unavailable on this run.</b>
      ${esc(String(msg).replace(/^\w+Error:\s*/, ""))}.`
      + (MULTI_OK ? "" : ` Showing ${esc(SOURCES.join(", ") || "no")} data only — the
      broker comparison needs two sources.`)]);
  document.getElementById("alerts").innerHTML = out.map(([cls, html]) =>
    `<div class="alert ${cls}" role="status"><span class="ico" aria-hidden="true">!</span>
       <div>${html}</div></div>`).join("");
}

renderAlerts(); renderKpis(); renderDetail(); renderBars(); renderTable();
</script>
</body>
</html>
